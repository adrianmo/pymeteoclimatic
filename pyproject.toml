[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymeteoclimatic"
dynamic = ["version"]
description = "A Python wrapper around the Meteoclimatic service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Adrián Moreno", email = "adrian@morenomartinez.com"}
]
keywords = ["meteoclimatic", "client", "library", "api", "weather"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
# The normalized model, parser and synchronous client IMPORT no third-party
# package. That is not the same as installing none: until 1.0 the entries
# below are installed by default. lxml and beautifulsoup4 are required only by the deprecated RSS
# transport and are removed together with it at 1.0.
#
# tzdata carries no code: it is the IANA time-zone database that zoneinfo
# falls back on when the operating system does not ship one, which is the
# case on Windows and on slim container images. Without it a valid station
# zone silently resolves to None, and the daily extremes and precipitation
# total are keyed to the station's local civil day, so that silence would
# be a wrong answer rather than a missing one. zoneinfo prefers system data
# when it exists, so this is a fallback and never an override.
dependencies = [
    "lxml>=4.5",
    "beautifulsoup4>=4.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Asynchronous client. Optional so that a synchronous consumer is never obliged
# to install an HTTP stack it does not use.
async = [
    "aiohttp>=3.8",
]

[project.urls]
Homepage = "https://github.com/adrianmo/pymeteoclimatic"
Repository = "https://github.com/adrianmo/pymeteoclimatic"

[tool.setuptools.packages.find]
include = ["meteoclimatic*"]

[tool.setuptools.dynamic]
version = {attr = "meteoclimatic.__version__"}
